# version: "3.8"
services:
  auth-db:
    image: soldevelo/postgresql
    container_name: vibecode-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth-data:/var/lib/postgresql

  user-db:
    image: soldevelo/postgresql
    container_name: vibecode-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-data:/var/lib/postgresql
  service-discovery:
    image: consul:1.15.4
    container_name: vibecode-consul
    ports:
      - "8500:8500"

  project-mongo:
    image: soldevelo/mongodb:latest
    container_name: vibecode-project-mongo
    ports:
      - "27017:27017"
    volumes:
      - project-mongo-data:/data/db
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  billing-db:
    image: soldevelo/postgresql
    container_name: vibecode-billing-db
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  auth-data:
    driver: local
  user-data:
    driver: local
  project-mongo-data:
    driver: local
